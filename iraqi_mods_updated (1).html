<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b0d">
<meta name="description" content="IRAQI MODS — مكتبة مودات ماينكرافت بيدروك العراقية">
<title>IRAQI MODS 🇮🇶</title>
<style>
:root{--accent:#42f5a7;--bg:#080b0d;--panel:#111719;--text:#f3f7f5;--muted:#9aa9a3;--line:#26352e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
a,button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1000px,92%);margin:auto}
.topbar{display:flex;align-items:center;justify-content:flex-end;padding:12px 0;position:relative}
.brand{font-weight:900;letter-spacing:.5px}
.menu-wrap{position:relative}
.dots{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font-size:24px}
.menu{display:none;position:absolute;top:48px;left:0;width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:5}
.menu.open{display:grid;gap:4px}
.menu button{border:0;background:transparent;color:var(--text);text-align:right;padding:10px;border-radius:8px}
.menu button:hover{background:#ffffff0c}
.hero{text-align:center;padding:28px 0 24px}
.avatar{width:96px;height:96px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 0 5px #42f5a715}
.placeholder{display:grid;place-items:center;margin:auto;background:var(--panel);color:var(--accent);font-size:30px;font-weight:900}
.hidden{display:none!important}
h1{font-size:clamp(28px,5vw,44px);margin:12px 0 6px}
.accent{color:var(--accent)}
.sub{color:var(--muted);line-height:1.8;max-width:600px;margin:0 auto}
.socials{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:17px 0}
.socials a{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text);text-decoration:none;border:1px solid var(--line);padding:10px 15px;border-radius:999px;background:#ffffff05;min-width:118px;transition:transform .15s,border-color .15s,background .15s}
.socials a:hover{border-color:var(--accent);background:#42f5a710;transform:translateY(-1px)}.socials svg{width:21px;height:21px;flex:none}.username{margin:13px 0 0;color:var(--muted);font-weight:700;direction:ltr}.banner{border-radius:22px}.mod-card,.empty,.modal,.admin-item,.search,.field,.dots,.btn,.download,.admin-delete{border-radius:16px}.mod-card{border-radius:20px}.download,.btn,.menu button,.dots{transition:transform .12s ease,filter .12s ease}.btn:active,.menu button:active,.dots:active,.download:active{transform:scale(.98)}
.banner{height:190px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;max-width:850px;margin:8px auto 0;background:linear-gradient(110deg,#171e1b,#101515)}
.profile-overlap{position:relative;margin:-45px 0 0 0;display:flex;justify-content:flex-start;padding-right:18px;z-index:1}.avatar{width:104px;height:104px;border:3px solid var(--bg);box-shadow:0 0 0 2px #ffffff55}.hero h1{margin-top:12px}.about-block,.support-block{max-width:850px;margin:25px auto 0;text-align:right;border-top:1px solid var(--line);padding-top:18px}.about-block h2,.support-block h2{font-size:20px;margin:0 0 10px}.about-block .sub{max-width:none;margin:0;white-space:pre-wrap}.socials{justify-content:flex-start;margin:12px 0 0}.socials a{min-width:145px;border-radius:16px;padding:14px 18px}.username{font-size:clamp(18px,4vw,24px);margin:4px 0 0;font-weight:800}
.banner img{width:100%;height:100%;object-fit:cover;display:none}
.banner-text{position:absolute;inset:0;display:grid;place-items:center;font-weight:850;letter-spacing:2px;color:#dce8e1}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 13px}
h2{font-size:22px;margin:0}
.search,.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#101619;color:var(--text);outline:none}
.search{max-width:330px}
.search:focus,.field:focus{border-color:var(--accent)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding-bottom:36px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:30px 15px;line-height:1.8}
.mod-card{overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:14px}
.mod-img{width:100%;height:145px;object-fit:cover;background:#17201c;display:block}
.mod-body{padding:13px}
.mod-body h3{margin:0 0 7px;font-size:17px}
.mod-body p{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.download{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#07120c;font-weight:800;padding:10px;border-radius:9px}
.download.disabled{opacity:.5;pointer-events:none}
.admin-delete{width:100%;margin-top:8px;padding:8px;background:#401a20;color:#ffdce0;border:1px solid #7d2a36;border-radius:9px}
.footer{border-top:1px solid var(--line);padding:20px 0 28px;text-align:center;color:var(--muted);font-size:13px}
.backdrop{position:fixed;inset:0;z-index:10;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
.backdrop.show{display:flex}
.modal{width:min(540px,100%);max-height:88vh;overflow:auto;background:#101718;border:1px solid #2b3b34;border-radius:16px;padding:17px}
.modal h2{margin-bottom:12px}
label{display:block;font-size:13px;color:#c3d0c9;margin:11px 0 5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:#1a2422;color:var(--text);padding:10px 13px;border-radius:9px}
.btn.primary{background:var(--accent);color:#06120b;border-color:var(--accent);font-weight:800}
.notice{font-size:13px;line-height:1.7;color:#e2d6aa;background:#292516;border:1px solid #4c4324;padding:10px;border-radius:9px;margin:10px 0}
.status{font-size:13px;line-height:1.7;margin-top:10px;overflow-wrap:anywhere}
.admin-list{display:grid;gap:8px;margin-top:16px}
.admin-item{border:1px solid var(--line);padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.admin-item span{overflow-wrap:anywhere}
@media(max-width:600px){.section-head{align-items:stretch;flex-direction:column}.search{max-width:none}.hero{padding-top:12px}.banner{height:150px}.profile-overlap{margin-top:-42px;padding-right:12px}.avatar{width:92px;height:92px}.socials a{flex:1;min-width:0}.mods{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.mod-img{height:115px}.mod-body{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  
  <div class="menu-wrap"><button class="dots" id="menuBtn" aria-label="القائمة">⋮</button>
    <div class="menu" id="menu"><button id="adminBtn">🔐 أنا الأدمن</button></div>
  </div>
</header>
<main>
<section class="hero">
  <div class="banner"><img id="bannerImg" alt="بانر الموقع"><div class="banner-text" id="bannerText">MINECRAFT • MODS • IRAQ</div></div>
  <div class="profile-overlap"><img class="avatar hidden" id="avatar" alt="صورة الحساب"><div class="avatar placeholder" id="avatarPlaceholder">IM</div></div>
  <h1 id="siteTitle">IRAQI MODS 🇮🇶</h1>
  <p class="username" id="siteUsername">@iraqi.mods</p>
  <section class="about-block"><h2>عن الموقع</h2><p class="sub" id="siteDesc">مكتبة مودات ماينكرافت بيدروك العراقية — اكتشف مودات جديدة واستمتع باللعب.</p></section>
  <section class="support-block"><h2>حساباتي</h2><nav class="socials">
    <a id="youtubeLink" href="https://youtube.com/@iraqi.mods1" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff4545" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg><span>YouTube</span></a>
    <a id="instagramLink" href="https://www.instagram.com/iraqi.mods" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb13b"/><stop offset=".5" stop-color="#ed3b83"/><stop offset="1" stop-color="#8d49f7"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="url(#ig)" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="url(#ig)" stroke-width="2.2"/><circle cx="17.7" cy="6.7" r="1.2" fill="#ed3b83"/></svg><span>Instagram</span></a>
    <a id="tiktokLink" href="https://www.tiktok.com/@iraqi.mods" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#25f4ee" d="M14 2h3c.2 2 1.4 3.8 3.5 4.5v3.1a9.4 9.4 0 0 1-3.5-1.3v6.4a6.4 6.4 0 1 1-6.4-6.4c.5 0 1 .1 1.4.2v3.3a3.2 3.2 0 1 0 1.9 2.9V2Z"/><path fill="#fe2c55" d="M12 7.5v3.3a3.1 3.1 0 0 0-1.4-.2 3.2 3.2 0 1 0 3.3 3.2V2h2.1c.3 2.2 1.6 3.8 3.5 4.5v2.1a9.4 9.4 0 0 1-3.5-1.3v6.4a6.4 6.4 0 1 1-6.4-6.4c.9 0 1.7.1 2.4.2Z" opacity=".75"/></svg><span>TikTok</span></a>
  </nav></section>
</section>
<section id="library">
  <div class="section-head"><h2 id="libraryTitle">مكتبة المودات</h2><input class="search" id="search" type="search" placeholder="ابحث عن مود..." aria-label="بحث"></div>
  <div class="mods" id="mods"><div class="empty">جاري تحميل المودات...</div></div>
</section>
</main>
<footer class="footer">IRAQI MODS 🇮🇶 · <span id="footerText">صُنع لعشّاق ماينكرافت</span></footer>
</div>
<div class="backdrop" id="modalBack"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <h2 id="modalTitle">الإعدادات</h2><div id="modalContent"></div>
  <div class="actions"><button class="btn" id="closeModal">إغلاق</button></div>
</section></div>
<script>
const $=s=>document.querySelector(s);
const defaults={lang:'ar',accent:'#42f5a7',title:'IRAQI MODS 🇮🇶',username:'@iraqi.mods',description:'مكتبة مودات ماينكرافت بيدروك العراقية — اكتشف مودات جديدة واستمتع باللعب.',youtube:'https://youtube.com/@iraqi.mods1',instagram:'https://www.instagram.com/iraqi.mods',tiktok:'https://www.tiktok.com/@iraqi.mods',avatar:'',banner:''};
let settings={...defaults};
let mods=[],adminPassword='',isAdmin=false;
const tr=(ar,en)=>settings.lang==='ar'?ar:en;
async function savePublicSettings(){const r=await fetch('/api/site-settings',{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Password':adminPassword},body:JSON.stringify(settings)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function loadPublicSettings(){try{const r=await fetch('/api/site-settings',{cache:'no-store'});if(r.ok){const j=await r.json();settings={...defaults,...j};apply()}}catch{}}
function compressImage(file,maxWidth=640,quality=.72){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('Not an image'));const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxWidth/img.width);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
let audioCtx;function clickSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=520;gain.gain.setValueAtTime(.018,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.045);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.05)}catch{}}
document.addEventListener('click',e=>{if(e.target.closest('button,.socials a,.download'))clickSound()});
function hexRgba(hex,a){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function apply(){document.documentElement.lang=settings.lang;document.documentElement.dir=settings.lang==='ar'?'rtl':'ltr';document.documentElement.style.setProperty('--accent',settings.accent);$('#siteTitle').textContent=settings.title;$('#siteDesc').textContent=settings.description;$('#siteUsername').textContent=settings.username||'@iraqi.mods';$('#youtubeLink').href=settings.youtube;$('#instagramLink').href=settings.instagram;$('#tiktokLink').href=settings.tiktok;$('#libraryTitle').textContent=tr('مكتبة المودات','Mod Library');$('#search').placeholder=tr('ابحث عن مود...','Search mods...');$('#footerText').textContent=tr('صُنع لعشّاق ماينكرافت','Made for Minecraft fans');$('#avatar').src=settings.avatar;$('#avatar').classList.toggle('hidden',!settings.avatar);$('#avatarPlaceholder').classList.toggle('hidden',!!settings.avatar);$('#bannerImg').src=settings.banner;$('#bannerImg').style.display=settings.banner?'block':'none';$('#bannerText').style.display=settings.banner?'none':'grid';renderMods()}
function openModal(title,html,after){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=html;$('#modalBack').classList.add('show');if(after)after()}
function closeModal(){$('#modalBack').classList.remove('show')}
$('#closeModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};
$('#menuBtn').onclick=()=>$('#menu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))$('#menu').classList.remove('open')});
async function api(method='GET',body=null,id=null){let url='/api/mods'+(id?'?id='+encodeURIComponent(id):'');let opts={method,headers:{}};if(body!==null){opts.headers['Content-Type']='application/json';opts.headers['X-Admin-Password']=adminPassword;opts.body=JSON.stringify(body)}else if(method!=='GET'){opts.headers['X-Admin-Password']=adminPassword}let r=await fetch(url,opts);let result;try{result=await r.json()}catch{result={error:'استجابة غير مفهومة من الخادم'}}if(!r.ok)throw new Error(result.error||('HTTP '+r.status));return result}
function norm(row){return {id:row.id,name:row.name||'',description:row.description||'',image:row.image_url||row.image||'',url:row.download_url||row.url||'',size:row.file_size||row.size||''}}
async function loadMods(){try{const rows=await api('GET');mods=Array.isArray(rows)?rows.map(norm):[];renderMods()}catch(e){$('#mods').innerHTML='<div class="empty">تعذر تحميل المودات حالياً. '+escapeHtml(e.message)+'</div>'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMods(){const q=$('#search').value.trim().toLowerCase();const list=mods.filter(m=>(m.name+' '+m.description).toLowerCase().includes(q));$('#mods').innerHTML='';if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent=mods.length?tr('ما لقينا مود بهذا الاسم.','No mods matched your search.'):tr('ماكو مودات مضافة حالياً. ترقّب الإضافات الجديدة!','No mods added yet. Check back soon!');$('#mods').append(d);return}for(const m of list){const c=document.createElement('article');c.className='mod-card';if(m.image){const im=document.createElement('img');im.className='mod-img';im.alt=m.name;im.loading='lazy';im.src=m.image;c.append(im)}const b=document.createElement('div');b.className='mod-body';const h=document.createElement('h3');h.textContent=m.name;const p=document.createElement('p');p.textContent=m.description;const meta=document.createElement('div');meta.className='meta';meta.textContent=tr('حجم الملف: ','File size: ')+(m.size||tr('غير محدد','Not specified'));const a=document.createElement('a');a.className='download'+(m.url?'':' disabled');a.textContent=tr('تحميل المود','Download mod');a.href=m.url||'#';a.target='_blank';a.rel='noopener';b.append(h,p,meta,a);if(isAdmin){const del=document.createElement('button');del.className='admin-delete';del.textContent=tr('حذف المود','Delete mod');del.onclick=()=>deleteMod(m);b.append(del)}c.append(b);$('#mods').append(c)}}
$('#search').addEventListener('input',renderMods);
function adminPanel(){openModal(tr('لوحة الأدمن','Admin panel'),`
<div class="notice">${tr('إعدادات الملف الشخصي هنا عامة وتظهر لكل زوار الموقع.','Profile settings here are public and visible to all visitors.')}</div>
<details open><summary style="cursor:pointer;font-weight:800;margin:12px 0">${tr('تخصيص واجهة الموقع','Customize public profile')}</summary>
<label>${tr('اسم الموقع','Site title')}</label><input class="field" id="publicTitle" maxlength="100">
<label>${tr('اسم المستخدم الظاهر تحت الصور','Username shown below images')}</label><input class="field" id="publicUsername" maxlength="80">
<label>${tr('الوصف (عن الموقع)','About / description')}</label><textarea class="field" id="publicDescription" rows="3" maxlength="500"></textarea>
<label>${tr('صورة الحساب من المعرض','Profile photo from gallery')}</label><input class="field" id="publicAvatar" type="file" accept="image/*">
<label>${tr('البنر من المعرض','Banner from gallery')}</label><input class="field" id="publicBanner" type="file" accept="image/*">
<label>YouTube URL</label><input class="field" id="publicYoutube" type="url">
<label>Instagram URL</label><input class="field" id="publicInstagram" type="url">
<label>TikTok URL</label><input class="field" id="publicTiktok" type="url">
<div class="actions"><button class="btn primary" id="savePublic">${tr('حفظ وإظهار للجميع','Save and publish to everyone')}</button></div><div class="status" id="publicStatus"></div></details>
<hr style="border-color:var(--line);margin:16px 0"><div class="notice">${tr('إضافة مود جديد','Add a new mod')}</div>
<label>${tr('اسم المود *','Mod name *')}</label><input class="field" id="modName" maxlength="120">
<label>${tr('الوصف','Description')}</label><textarea class="field" id="modDesc" rows="3" maxlength="1500"></textarea>
<label>${tr('صورة المود من المعرض (اختياري)','Mod image from gallery (optional)')}</label><input class="field" id="modImageFile" type="file" accept="image/*">
<label>${tr('أو رابط الصورة (اختياري)','Or image URL (optional)')}</label><input class="field" id="modImage" type="url">
<label>${tr('رابط التحميل *','Download URL *')}</label><input class="field" id="modUrl" type="url" required>
<label>${tr('حجم الملف','File size')}</label><input class="field" id="modSize" maxlength="40" placeholder="مثال: 12 MB">
<div class="actions"><button class="btn primary" id="addMod">${tr('إضافة المود','Add mod')}</button><button class="btn" id="logout">${tr('تسجيل الخروج','Log out')}</button></div>
<div class="status" id="adminStatus"></div><div class="admin-list" id="adminList"></div>`,()=>{$('#publicTitle').value=settings.title;$('#publicUsername').value=settings.username;$('#publicDescription').value=settings.description;$('#publicYoutube').value=settings.youtube;$('#publicInstagram').value=settings.instagram;$('#publicTiktok').value=settings.tiktok;$('#savePublic').onclick=saveAdminPublicSettings;$('#addMod').onclick=addMod;$('#logout').onclick=()=>{adminPassword='';isAdmin=false;renderMods();closeModal()};showAdminList()})}
async function saveAdminPublicSettings(){const status=$('#publicStatus');const next={...settings,title:$('#publicTitle').value.trim()||defaults.title,username:$('#publicUsername').value.trim()||defaults.username,description:$('#publicDescription').value.trim(),youtube:$('#publicYoutube').value.trim()||defaults.youtube,instagram:$('#publicInstagram').value.trim()||defaults.instagram,tiktok:$('#publicTiktok').value.trim()||defaults.tiktok};try{status.textContent=tr('جاري الحفظ والنشر...','Saving and publishing...');if($('#publicAvatar').files[0])next.avatar=await compressImage($('#publicAvatar').files[0],320,.72);if($('#publicBanner').files[0])next.banner=await compressImage($('#publicBanner').files[0],1100,.62);const bytes=(next.avatar.length||0)+(next.banner.length||0);if(bytes>700000){status.textContent=tr('الصور كبيرة جداً. اختر صوراً أصغر.','Images are too large. Choose smaller images.');return}settings=next;await savePublicSettings();apply();status.textContent=tr('تم الحفظ. التغييرات ظاهرة لكل الزوار.','Saved. Changes are visible to all visitors.')}catch(e){status.textContent=tr('فشل الحفظ: ','Save failed: ')+e.message}}
function showAdminList(){const box=$('#adminList');if(!box)return;box.innerHTML='';mods.forEach(m=>{const row=document.createElement('div');row.className='admin-item';const name=document.createElement('span');name.textContent=m.name;const del=document.createElement('button');del.className='btn';del.textContent=tr('حذف','Delete');del.onclick=()=>deleteMod(m);row.append(name,del);box.append(row)})}
async function addMod(){const name=$('#modName').value.trim(),description=$('#modDesc').value.trim(),download_url=$('#modUrl').value.trim(),file_size=$('#modSize').value.trim();const status=$('#adminStatus');let image_url=$('#modImage').value.trim();try{if($('#modImageFile').files[0])image_url=await compressImage($('#modImageFile').files[0],640,.72)}catch(e){status.textContent=tr('تعذر قراءة الصورة.','Could not read image.');return}if(!name||!download_url){status.textContent=tr('اسم المود ورابط التحميل مطلوبان.','Name and download URL are required.');return}try{status.textContent=tr('جاري الإضافة...','Adding...');await api('POST',{name,description,image_url,download_url,file_size});await loadMods();$('#modName').value='';$('#modDesc').value='';$('#modImage').value='';$('#modImageFile').value='';$('#modUrl').value='';$('#modSize').value='';status.textContent=tr('تمت إضافة المود.','Mod added.');showAdminList()}catch(e){status.textContent=tr('فشلت الإضافة: ','Add failed: ')+e.message}}
async function deleteMod(m){if(!confirm(tr('متأكد تريد حذف المود؟','Delete this mod?')))return;try{await api('DELETE',null,m.id);await loadMods();if($('#adminList'))showAdminList()}catch(e){alert(tr('فشل الحذف: ','Delete failed: ')+e.message)}}
$('#adminBtn').onclick=()=>{openModal(tr('دخول الأدمن','Admin sign in'),`<label>${tr('كلمة مرور الأدمن','Admin password')}</label><input class="field" id="adminPass" type="password" autocomplete="current-password"><div class="status" id="loginStatus"></div><div class="actions"><button class="btn primary" id="loginBtn">${tr('دخول','Sign in')}</button></div>`,()=>{$('#loginBtn').onclick=async()=>{const pass=$('#adminPass').value;if(!pass){$('#loginStatus').textContent=tr('اكتب كلمة المرور.','Enter the password.');return}adminPassword=pass;$('#loginStatus').textContent=tr('جاري التحقق...','Checking...');try{const check=await fetch('/api/mods?id=0',{method:'DELETE',headers:{'X-Admin-Password':adminPassword}});if(check.status===401)throw new Error('BAD_PASSWORD');if(check.status!==400)throw new Error('SERVER_ERROR');$('#loginStatus').textContent=tr('تم التحقق.','Verified.');isAdmin=true;await loadMods();adminPanel()}catch(e){adminPassword='';$('#loginStatus').textContent=e.message==='BAD_PASSWORD'?tr('كلمة المرور غير صحيحة.','Incorrect password.'):tr('تعذر التحقق. تأكد من إعدادات الخادم.','Could not verify. Check server settings.')}}})};
apply();loadPublicSettings();loadMods();
</script>
</body>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b0d"><meta name="description" content="IRAQI MODS — مكتبة مودات ماينكرافت بيدروك العراقية">
<title>IRAQI MODS 🇮🇶</title>
<style>
:root{--accent:#42f5a7;--bg:#070a0c;--panel:#101619;--text:#f3f7f5;--muted:#9aa9a3;--line:#24332d;--glow:rgba(66,245,167,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 35%),radial-gradient(ellipse at 12% 15%,rgba(206,20,40,.10),transparent 38%),radial-gradient(ellipse at 80% 52%,rgba(255,255,255,.045),transparent 42%),radial-gradient(ellipse at 45% 95%,rgba(20,150,75,.10),transparent 35%),#070a0c}#network{position:fixed;inset:0;width:100%;height:100%;z-index:-2;opacity:.48;pointer-events:none}.wrap{width:min(1080px,92%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;padding:17px 0;position:relative;z-index:5}.brand-mini{font-weight:900;letter-spacing:1px}.menu-wrap{position:relative}.dots{border:1px solid var(--line);background:#101619;color:var(--text);font-size:24px;border-radius:12px;width:44px;height:44px;cursor:pointer}.menu{display:none;position:absolute;top:50px;left:0;width:190px;background:#11191a;border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:0 12px 40px #0009}.menu.open{display:grid;gap:5px}.menu button,.menu select{width:100%;text-align:right;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--text);cursor:pointer;font:inherit}.menu button:hover{background:#ffffff0c}.hero{text-align:center;padding:35px 0 30px}.avatar{width:104px;height:104px;border-radius:28px;border:1px solid #ffffff30;box-shadow:0 0 32px var(--glow);object-fit:cover;background:#141b1a}.avatar-placeholder{display:grid;place-items:center;font-size:35px;font-weight:950;color:var(--accent)}h1{font-size:clamp(29px,6vw,48px);margin:13px 0 5px;letter-spacing:1px}.iraq{color:var(--accent)}.sub{color:var(--muted);margin:0 auto;max-width:580px;line-height:1.8}.socials{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:19px 0}.socials a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:12px;background:#ffffff05;font-size:14px;transition:.2s}.socials a:hover{border-color:var(--accent);box-shadow:0 0 18px var(--glow);transform:translateY(-2px)}.banner{height:145px;border-radius:19px;border:1px solid var(--line);margin:23px auto 0;max-width:850px;overflow:hidden;position:relative;background:linear-gradient(115deg,#171c1b,#101515 48%,#171a18)}.banner img{width:100%;height:100%;object-fit:cover;display:none}.banner .banner-text{position:absolute;inset:0;display:grid;place-items:center;color:#dce8e1;font-weight:800;letter-spacing:3px;font-size:clamp(17px,4vw,27px);text-shadow:0 0 20px var(--glow)}.section-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:26px 0 15px}.section-head h2{font-size:23px;margin:0}.search{width:min(360px,100%);background:#101619;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding-bottom:45px}.empty{grid-column:1/-1;border:1px dashed #31413a;border-radius:16px;text-align:center;padding:38px 16px;color:var(--muted);line-height:1.8}.mod-card{overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#12191a,#0c1112);border-radius:17px;transition:.22s}.mod-card:hover{transform:translateY(-3px);border-color:#3a7559;box-shadow:0 10px 30px #0004}.mod-img{width:100%;height:155px;object-fit:cover;background:#171f1d;display:block}.mod-body{padding:15px}.mod-body h3{margin:0 0 8px;font-size:18px}.mod-body p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 12px;white-space:pre-wrap}.meta{font-size:12px;color:var(--muted);margin-bottom:12px}.download{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#07120c;font-weight:850;padding:10px;border-radius:10px}.download.disabled{opacity:.5;pointer-events:none}.admin-delete{margin-top:8px;width:100%;padding:8px;background:#401a20;color:#ffdce0;border:1px solid #7d2a36;border-radius:9px}.footer{border-top:1px solid var(--line);padding:22px 0 30px;text-align:center;color:var(--muted);font-size:13px}.modal-back{position:fixed;inset:0;z-index:10;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}.modal-back.show{display:flex}.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:#101718;border:1px solid #2b3b34;border-radius:18px;padding:19px;box-shadow:0 20px 70px #000a}.modal h2{margin:0 0 15px}.modal label{display:block;font-size:13px;color:#c3d0c9;margin:12px 0 6px}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#080d0e;color:var(--text);font:inherit}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);background:#1a2422;color:var(--text);padding:10px 14px;border-radius:10px;font:inherit;cursor:pointer}.btn.primary{background:var(--accent);color:#06120b;border-color:var(--accent);font-weight:800}.notice{font-size:13px;line-height:1.7;color:#d4c69a;background:#292516;border:1px solid #4c4324;padding:11px;border-radius:10px;margin:12px 0}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}@media(max-width:600px){.section-head{align-items:stretch;flex-direction:column}.search{width:100%}.banner{height:115px}.hero{padding-top:22px}.admin-grid{grid-template-columns:1fr}}
</style></head>
<body>
<canvas id="network"></canvas>
<div class="wrap">
<header class="topbar"><div class="brand-mini">IRAQI MODS <span class="iraq">🇮🇶</span></div><div class="menu-wrap"><button class="dots" id="menuBtn" aria-label="القائمة">⋮</button><div class="menu" id="menu"><button id="settingsBtn">⚙️ الإعدادات / Settings</button><button id="adminBtn">🔐 أنا الأدمن / I'm admin</button></div></div></header>
<main>
<section class="hero"><img class="avatar hidden" id="avatar" alt="صورة القناة"><div class="avatar avatar-placeholder" id="avatarPlaceholder">IM</div><h1 id="siteTitle">IRAQI MODS <span class="iraq">🇮🇶</span></h1><p class="sub" id="siteDesc">مكتبة مودات ماينكرافت بيدروك العراقية — اكتشف مودات جديدة واستمتع باللعب.</p>
<nav class="socials"><a id="youtubeLink" href="https://youtube.com/@iraqi.mods1" target="_blank" rel="noopener">▶ YouTube</a><a id="instagramLink" href="https://www.instagram.com/iraqi.mods" target="_blank" rel="noopener">◎ Instagram</a><a id="tiktokLink" href="https://www.tiktok.com/@iraqi.mods" target="_blank" rel="noopener">♪ TikTok</a></nav>
<div class="banner"><img id="bannerImg" alt="بانر الموقع"><div class="banner-text" id="bannerText">MINECRAFT • MODS • IRAQ</div></div></section>
<section id="library"><div class="section-head"><h2 id="libraryTitle">مكتبة المودات</h2><input class="search" id="search" type="search" placeholder="ابحث عن مود..." aria-label="بحث"></div><div class="mods" id="mods"><div class="empty" id="empty">ماكو مودات مضافة حالياً.<br>ترقّب الإضافات الجديدة!</div></div></section>
</main><footer class="footer">IRAQI MODS 🇮🇶 · <span id="footerText">صُنع لعشّاق ماينكرافت</span></footer>
</div>
<div class="modal-back" id="modalBack"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">الإعدادات</h2><div id="modalContent"></div><div class="modal-actions"><button class="btn" id="closeModal">إغلاق</button></div></section></div>
<script>
const $=s=>document.querySelector(s);const storageKey='iraqiModsSiteV1';
const defaults={lang:'ar',accent:'#42f5a7',title:'IRAQI MODS 🇮🇶',description:'مكتبة مودات ماينكرافت بيدروك العراقية — اكتشف مودات جديدة واستمتع باللعب.',youtube:'https://youtube.com/@iraqi.mods1',instagram:'https://www.instagram.com/iraqi.mods',tiktok:'https://www.tiktok.com/@iraqi.mods',avatar:'',banner:'',mods:[]};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem(storageKey)||'{}')}}catch(e){data={...defaults}};
const isAr=()=>data.lang==='ar';function save(){try{localStorage.setItem(storageKey,JSON.stringify(data))}catch(e){alert(isAr()?'مساحة التخزين ممتلئة. استخدم صوراً أصغر.':'Storage is full. Try smaller images.')}}
function tr(ar,en){return isAr()?ar:en}function apply(){document.documentElement.lang=data.lang;document.documentElement.dir=isAr()?'rtl':'ltr';document.documentElement.style.setProperty('--accent',data.accent);document.documentElement.style.setProperty('--glow',hexRgba(data.accent,.18));$('#siteTitle').textContent=data.title;$('#siteDesc').textContent=data.description;$('#youtubeLink').href=data.youtube;$('#instagramLink').href=data.instagram;$('#tiktokLink').href=data.tiktok;$('#libraryTitle').textContent=tr('مكتبة المودات','Mod Library');$('#search').placeholder=tr('ابحث عن مود...','Search mods...');$('#footerText').textContent=tr('صُنع لعشّاق ماينكرافت','Made for Minecraft fans');$('#avatar').src=data.avatar;$('#avatar').classList.toggle('hidden',!data.avatar);$('#avatarPlaceholder').classList.toggle('hidden',!!data.avatar);$('#bannerImg').src=data.banner;$('#bannerImg').style.display=data.banner?'block':'none';$('#bannerText').style.display=data.banner?'none':'grid';renderMods()}
function hexRgba(hex,a){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function renderMods(){let q=$('#search').value.trim().toLowerCase();let list=data.mods.filter(m=>(m.name+' '+m.description).toLowerCase().includes(q));$('#mods').innerHTML='';if(!list.length){let d=document.createElement('div');d.className='empty';d.textContent=data.mods.length?tr('ما لقينا مود بهذا الاسم.','No mods matched your search.'):tr('ماكو مودات مضافة حالياً. ترقّب الإضافات الجديدة!','No mods added yet. Check back soon!');$('#mods').append(d);return}list.forEach(m=>{let c=document.createElement('article');c.className='mod-card';let im=document.createElement('img');im.className='mod-img';im.alt=m.name;im.src=m.image||'';if(!m.image)im.style.display='none';let b=document.createElement('div');b.className='mod-body';let h=document.createElement('h3');h.textContent=m.name;let p=document.createElement('p');p.textContent=m.description||'';let meta=document.createElement('div');meta.className='meta';meta.textContent=tr('حجم الملف: ','File size: ')+(m.size||tr('غير محدد','Not specified'));let a=document.createElement('a');a.className='download'+(m.url?'':' disabled');a.textContent=tr('تحميل من MediaFire','Download from MediaFire');a.href=m.url||'#';a.target='_blank';a.rel='noopener';b.append(h,p,meta,a);c.append(im,b);$('#mods').append(c)})}
$('#search').addEventListener('input',renderMods);$('#menuBtn').onclick=()=>$('#menu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))$('#menu').classList.remove('open')});
function openModal(title,html,after){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=html;$('#modalBack').classList.add('show');if(after)after()};function closeModal(){$('#modalBack').classList.remove('show')};$('#closeModal').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});
$('#settingsBtn').onclick=()=>{openModal(tr('الإعدادات','Settings'),`<label>${tr('لغة الموقع','Website language')}</label><select class="field" id="lang"><option value="ar">العربية</option><option value="en">English</option></select><label>${tr('لون الإضاءة','Accent colour')}</label><input class="field" type="color" id="accent"><div class="notice">${tr('الإعدادات تنحفظ على هذا المتصفح. تغيير اللون واللغة لا يحتاج لوحة الأدمن.','Settings are saved in this browser. You do not need the admin panel to change language or colour.')}</div><div class="modal-actions"><button class="btn primary" id="saveSettings">${tr('حفظ الإعدادات','Save settings')}</button></div>`,()=>{$('#lang').value=data.lang;$('#accent').value=data.accent;$('#saveSettings').onclick=()=>{data.lang=$('#lang').value;data.accent=$('#accent').value;save();apply();closeModal()}})};
$('#adminBtn').onclick=()=>{openModal(tr('دخول الأدمن','Admin access'),`<label>${tr('كلمة مرور الأدمن','Admin password')}</label><input class="field" id="adminPass" type="password" autocomplete="current-password" placeholder="••••••••"><div class="notice">${tr('واجهة الدخول جاهزة، لكن تسجيل الدخول الحقيقي ولوحة الإدارة يحتاجان ربطاً آمناً بالخادم. لا تدخل كلمة مرورك الحقيقية هنا إلى أن نكمل الربط.','The password-only screen is ready, but real authentication and the admin panel need secure server setup. Do not enter your real password until we finish that setup.')}</div><div class="modal-actions"><button class="btn primary" id="loginInfo">${tr('دخول','Sign in')}</button></div>`,()=>{$('#loginInfo').onclick=()=>alert(tr('تسجيل الدخول الحقيقي غير مفعّل بعد. لازم نربط الموقع بخدمة آمنة قبل ما نفتح لوحة الإدارة.','Real sign-in is not enabled yet. Connect secure authentication before enabling the admin panel.'))})};
// Animated network background
const canvas=$('#network'),ctx=canvas.getContext('2d');let points=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let count=Math.min(75,Math.floor(innerWidth/15));points=Array.from({length:count},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.5+.7,phase:Math.random()*6}))}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#42f5a7';for(let i=0;i<points.length;i++){let p=points[i];p.x+=p.vx;p.y+=p.vy;p.phase+=.025;if(p.x<0||p.x>innerWidth)p.vx*=-1;if(p.y<0||p.y>innerHeight)p.vy*=-1;for(let j=i+1;j<points.length;j++){let q=points[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);if(d<125){ctx.globalAlpha=(1-d/125)*.25;ctx.strokeStyle=col;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}ctx.globalAlpha=.35+Math.sin(p.phase)*.2;ctx.fillStyle=i%4===0?'#ffffff':col;ctx.shadowBlur=8;ctx.shadowColor=col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw();apply();
</script></body></html>

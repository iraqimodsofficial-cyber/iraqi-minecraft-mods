
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة موداتي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b10;color:#f5f5f7;font-family:Arial,sans-serif}
header{padding:35px 18px;text-align:center;background:#151520;border-bottom:1px solid #292938}
.avatar{width:85px;height:85px;border-radius:50%;background:#292943;margin:auto;display:grid;place-items:center;font-size:35px}
h1{margin-bottom:8px}
p{color:#b8b8c8;line-height:1.8}
a{color:#b8a2ff;text-decoration:none}
button{background:#8065e8;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:15px}
main{max-width:850px;margin:auto;padding:22px 16px}
h2{font-size:21px}
.card{background:#15151e;border:1px solid #292936;border-radius:15px;padding:18px;margin:15px 0}
.empty{text-align:center;padding:30px 10px}
footer{text-align:center;padding:25px;color:#888}
</style>
</head>
<body>
<header>
<div class="avatar">⛏️</div>
<h1>مكتبة موداتي</h1>
<p>مودات ماينكرافت من صنعي، حمل واستمتع!</p>
<a href="https://www.youtube.com/" target="_blank">قناتي على يوتيوب</a>
</header>
<main>
<h2>📦 أحدث المودات</h2>
<div class="card empty">
<h3>قريباً!</h3>
<p>موداتي الجديدة راح تنزل هنا.</p>
</div>
</main>
<footer>© مكتبة موداتي</footer>
</body>
</html>
